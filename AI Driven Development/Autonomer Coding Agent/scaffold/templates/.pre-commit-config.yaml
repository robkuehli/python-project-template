# .pre-commit-config.yaml — deterministisches Gate (siehe Guidelines/Pre-Commit Guidelines.md)
# Reihenfolge: strukturelle Sicherheit -> Lint/Format -> Typen -> schnelle Tests -> Docstrings.
repos:
  # Phase 1: strukturelle Sicherheit + Secrets
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  # Phase 2: Lint + Format (ruff ersetzt black/isort/flake8/pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Phase 3: Typ-Check
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-requests, types-PyYAML]
        args: ["--strict"]

  # Phase 4: schnelle Unit-Tests (nicht die volle Suite)
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick)
        entry: pytest -x -m "not slow and not integration"
        language: system
        pass_filenames: false
        always_run: true

  # Phase 5: Docstring-Coverage
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ["--fail-under=80", "src/"]
