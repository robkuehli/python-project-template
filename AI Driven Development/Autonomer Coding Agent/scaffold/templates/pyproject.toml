# pyproject.toml — eine Datei, vier Tools (siehe Guidelines/Pre-Commit Guidelines.md).
[project]
name = "poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "interrogate", "dirty-equals", "inline-snapshot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]            # line-length via Formatter
extend-select = ["D"]        # pydocstyle

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "slow: tests langsamer als 1 s",
    "integration: braucht externe Ressourcen",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
