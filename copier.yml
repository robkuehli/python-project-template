# Copier configuration for a standard Python project template
# (uv + just + pre-commit + mkdocs + AI coding agents).
#
# Docs:  https://copier.readthedocs.io
# Usage:
#   uv tool install copier==9.17.1
#   copier copy --trust gh:robkuehli/python-project-template path/to/new-project
#
# The actual template lives in the `template/` subdirectory.

_subdirectory: "template"
_min_copier_version: "9.4.0"
_answers_file: ".copier-answers.yml"

# Files inside template/ to skip entirely.
_exclude:
  - ".git"
  - ".venv"
  - ".DS_Store"
  - "__pycache__"
  - ".mypy_cache"
  - ".ruff_cache"
  - ".pylint.d"
  - "*.py[co]"
  - "site"
  - "node_modules"

# Post-generation tasks. Only run when Copier is invoked with `--trust`.
# Without --trust, the project is generated but these are skipped.
_tasks:
  - "git init -q -b main"
  # Replace the copied skills directory with a symlink so docs/skills and
  # the top-level skills/ stay in sync. Copier dereferences symlinks during
  # copy, so this has to be re-established after generation.
  - "rm -rf docs/skills && ln -s ../skills docs/skills"
  # Sandbox secret bootstrap — populates `.env` with `openssl rand` values for
  # SEARXNG_SECRET (+ CRAWL4AI_API_TOKEN / LANGFUSE_* where enabled) right now,
  # so the rendered project is ready for `docker compose up` / `just sandbox-up`
  # without an extra manual step. Idempotent: `just sandbox-init` re-runs the
  # same logic and skips keys that already exist. Runs *before* `uv sync` so a
  # later sync failure still leaves a populated `.env` behind. Both branches
  # WARN-only so generation never hard-fails on a missing host-level prereq.
  - |
    {% if include_sandbox and sandbox_auto_init -%}
    if command -v just >/dev/null 2>&1; then
      just sandbox-init || echo "WARN: 'just sandbox-init' failed. '.env' is unpopulated; 'docker compose up' / 'just sandbox-up' will fail loudly on the ':?' guards. Re-run manually; see docker/README.md.";
    else
      echo "WARN: just not found on PATH. '.env' is unpopulated; 'docker compose up' / 'just sandbox-up' will fail loudly on the ':?' guards. Install just and run 'just sandbox-init' manually; see docker/README.md.";
    fi
    {%- else -%}
    true
    {%- endif %}
  - "uv sync"
  - "uv run pre-commit install"
  # Codex and Pi both discover repository skills under `.agents/skills`.
  # Keep `skills/` as the human-facing canonical directory and expose it at
  # the native discovery path without duplicating the skill files.
  - |
    {% if 'codex' in coding_agents or 'pi' in coding_agents -%}
    mkdir -p .agents
    if [ ! -e .agents/skills ] && [ ! -L .agents/skills ]; then
      ln -s ../skills .agents/skills
    fi
    {%- else -%}
    true
    {%- endif %}
  # SDD bootstrap — runs `init` non-interactively when the CLI is available.
  # No-op for sdd_framework=none. Both the missing-CLI branch and the
  # init-failure branch print WARN-only so generation never hard-fails on
  # a missing host-level prereq or a future flag rename.
  - |
    {% if sdd_framework == 'spec-kit' -%}
    if command -v specify >/dev/null 2>&1; then
      specify init . --here --integration {{ sdd_install_agent }} --force --ignore-agent-tools \
        || echo "WARN: specify init failed. Re-run manually; see docs/how-to/spec-driven-development.md.";
    else
      echo "WARN: specify CLI not found on PATH. Install via 'uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@{{ tool_versions.spec_kit_ref }}' and run 'specify init . --here --integration {{ sdd_install_agent }} --force --ignore-agent-tools'. See docs/how-to/spec-driven-development.md.";
    fi
    {%- else -%}
    true
    {%- endif %}

# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------
project_name:
  type: str
  help: "Human-readable project name (e.g. 'My Awesome Project')"
  validator: >-
    {% if not project_name.strip() or not (project_name | regex_search('^[^\r\n]{1,100}$')) %}
    Use a non-empty, single-line project name of at most 100 characters.
    {% endif %}

project_slug:
  type: str
  help: "Repository / directory name (kebab-case)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if project_slug | length > 63 or not (project_slug | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Use at most 63 lowercase letters, digits, and single dashes; start with a letter.
    {% endif %}

package_name:
  type: str
  help: "Importable Python package name (snake_case)"
  default: "{{ project_slug | lower | replace('-', '_') }}"
  validator: >-
    {% set keywords = ['false', 'none', 'true', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    {% if package_name | length > 64 or package_name in keywords or not (package_name | regex_search('^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$')) %}
    Use a non-keyword Python identifier of at most 64 lowercase letters, digits, and single underscores.
    {% endif %}

project_description:
  type: str
  help: "One-line description of the project"
  default: "A standard Python project."
  validator: >-
    {% if not project_description.strip() or not (project_description | regex_search('^[^\r\n]{1,200}$')) %}
    Use a non-empty, single-line description of at most 200 characters.
    {% endif %}

author_name:
  type: str
  help: "Author / maintainer name"
  default: "Your Name"
  validator: >-
    {% if not author_name.strip() or not (author_name | regex_search('^[^\r\n]{1,100}$')) %}
    Use a non-empty, single-line author name of at most 100 characters.
    {% endif %}

author_email:
  type: str
  help: "Author / maintainer email"
  default: "you@example.com"
  validator: >-
    {% if author_email | length > 254 or not (author_email | regex_search('^[^@\s]+@[^@\s]+\.[^@\s]+$')) %}
    Enter a single-line email address such as name@example.com.
    {% endif %}

github_username:
  type: str
  help: "GitHub username or org (used for URLs)"
  default: "your-username"
  validator: >-
    {% if '--' in github_username or not (github_username | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$')) %}
    Use a GitHub user/org name of at most 39 letters, digits, or single dashes.
    {% endif %}

python_version:
  type: str
  help: >-
    Target Python version. Limited to releases the linter stack fully
    supports. 3.14 is stable since Oct 2025 and supported by Ruff 0.15,
    mypy 2.1, and Pylint 4.x. Bump the template (and these choices) when
    a newer release lands and the linter stack catches up.
  default: "3.13"
  choices:
    - "3.12"
    - "3.13"
    - "3.14"

# ---------------------------------------------------------------------------
# AI coding agents
# ---------------------------------------------------------------------------
coding_agents:
  type: str
  multiselect: true
  help: "Which AI coding agents should this project support? (AGENTS.md is always created)"
  choices:
    "Claude Code (.claude/, CLAUDE.md)": "claude_code"
    "Codex CLI (.codex/ + shared skills)": "codex"
    "Pi Coding Agent (AGENTS.md + shared skills)": "pi"
    "OpenCode (.opencode/ + opencode.json)": "opencode"
    "Aider (.aider.conf.yml)": "aider"
  default:
    - "claude_code"
    - "codex"

# --- Claude Code -----------------------------------------------------------
claude_provider:
  type: str
  help: "Claude Code: which backend?"
  choices:
    "LiteLLM gateway (company / Bedrock / mixed)": "litellm"
    "Claude subscription (Pro/Max, /login)": "subscription"
  default: "litellm"
  when: "{{ 'claude_code' in coding_agents }}"

# --- Codex CLI -------------------------------------------------------------
codex_provider:
  type: str
  help: "Codex CLI: which backend?"
  choices:
    "ChatGPT subscription (codex login)": "subscription"
    "LiteLLM gateway (OpenAI-compatible)": "litellm"
  default: "subscription"
  when: "{{ 'codex' in coding_agents }}"

# --- Pi Coding Agent -------------------------------------------------------
# Pi reads AGENTS.md and `.agents/skills` natively. Provider/model selection
# stays user-scoped via `/login` and `/model`, so no project prompt is needed.

# --- Aider -----------------------------------------------------------------
aider_provider:
  type: str
  help: "Aider: which backend?"
  choices:
    "LiteLLM gateway (OpenAI-compatible)": "litellm"
    "Ollama (local models)": "ollama"
  default: "litellm"
  when: "{{ 'aider' in coding_agents }}"

aider_model:
  type: str
  help: "Aider default model (model alias on the chosen backend)"
  default: "{% if aider_provider == 'ollama' %}ollama/qwen3-coder:30b{% else %}claude-sonnet-5{% endif %}"
  validator: >-
    {% if not (aider_model | regex_search('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$')) %}
    Use a model identifier containing only letters, digits, dots, underscores, colons, slashes, or dashes.
    {% endif %}
  when: "{{ 'aider' in coding_agents }}"

# --- OpenCode --------------------------------------------------------------
# Backend is always Ollama. Cloud-tier models go through the same client
# (just `:cloud`-tagged) but require an Ollama Cloud subscription.
ollama_subscription:
  type: bool
  help: >-
    Do you have an Ollama Cloud subscription (ran `ollama signin`)?
    Required for Cloud/Hybrid tiers below.
  default: false
  when: "{{ 'opencode' in coding_agents }}"

ollama_tier:
  type: str
  help: "OpenCode model tier (large + small_model defaults follow this)"
  choices:
    "Hybrid — large = cloud frontier, small = best local (recommended)": "hybrid"
    "Cloud — every role on Ollama Cloud frontier models": "cloud"
    "Local — best local models only": "local"
  # No subscription → tier forced to 'local' (and the question is skipped).
  default: "{% if ollama_subscription %}hybrid{% else %}local{% endif %}"
  when: "{{ 'opencode' in coding_agents and ollama_subscription }}"

# --- Context7 MCP (shared, opt-in) -----------------------------------------
# Context7 fetches current library docs into the model context — solves the
# stale-training-data problem for Python libs. Opt-in because it is an
# external service (queries leave the sandbox) and a supply-chain factor
# (OWASP ASI04): requires Node on PATH and executes a pinned npm package.
# on first use. Available for Claude Code, Codex CLI, and OpenCode; Pi and
# Aider have no built-in MCP support.
include_context7:
  type: bool
  help: >-
    Enable the Context7 MCP server? Fetches up-to-date library docs into the
    model context (solves stale-training-data for Python libs). Opt-in —
    requires Node on PATH; queries leave the sandbox (external service
    mcp.context7.com); adds a supply-chain factor (OWASP ASI04). Available
    for Claude Code, Codex CLI, OpenCode; Pi and Aider have no built-in MCP support.
  default: false
  when: "{{ 'claude_code' in coding_agents or 'codex' in coding_agents or 'opencode' in coding_agents }}"

# --- Shared backend URLs ---------------------------------------------------
litellm_base_url:
  type: str
  help: "LiteLLM gateway base URL (auth token lives in your shell, never committed)"
  default: "https://litellm.internal.example.com"
  validator: >-
    {% if litellm_base_url | length > 2048 or not (litellm_base_url | regex_search('^https?://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+$')) %}
    Enter a single-line http(s) URL without quotes, backslashes, or template characters.
    {% endif %}
  when: >-
    {{
      ('claude_code' in coding_agents and claude_provider == 'litellm')
      or ('codex' in coding_agents and codex_provider == 'litellm')
      or ('aider' in coding_agents and aider_provider == 'litellm')
    }}

ollama_base_url:
  type: str
  help: "Ollama base URL (local daemon, default localhost:11434)"
  default: "http://localhost:11434"
  validator: >-
    {% if ollama_base_url | length > 2048 or not (ollama_base_url | regex_search('^https?://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+$')) %}
    Enter a single-line http(s) URL without quotes, backslashes, or template characters.
    {% endif %}
  when: >-
    {{
      'opencode' in coding_agents
      or ('aider' in coding_agents and aider_provider == 'ollama')
    }}

# ---------------------------------------------------------------------------
# Sandbox (Docker-Compose)
# ---------------------------------------------------------------------------
include_sandbox:
  type: bool
  help: >-
    Generate a Docker-Compose sandbox? Mounts the repo into an isolated container
    so the agent can't reach host secrets. Includes optional SearXNG (web search)
    and LLM observability.
  default: false

sandbox_observability:
  type: str
  help: >-
    Sandbox observability / cost-tracking service. Default is MLflow because
    the Langfuse v3 self-hosted stack adds five sidecars (ClickHouse, Redis,
    MinIO, Worker, Postgres) on top of the web service — useful only when LLM
    cost/trace dashboards are actually needed.
  choices:
    "MLflow (classic ML experiment tracking, single container)": "mlflow"
    "Langfuse (LLM-native, cost + tracing + dashboards; v3 = 6 containers)": "langfuse"
    "None (no observability service)": "none"
  default: "mlflow"
  when: "{{ include_sandbox }}"

include_crawl4ai:
  type: bool
  help: >-
    Add a Crawl4AI sidecar (Playwright + Chromium, LLM-friendly markdown output)
    for JS-rendered fetches? Without it, agents fall back to their native
    HTTP-only WebFetch tools — fine for static docs, blind to SPAs. Adds
    ~1.4 GB image pull on first start (Crawl4AI 0.8.x).
  default: false
  when: "{{ include_sandbox }}"

sandbox_auto_init:
  type: bool
  help: >-
    Auto-generate missing sandbox secrets into `.env` **now**, at the end of
    `copier copy` (requires `--trust`; without it run `just sandbox-init`
    manually after generation)? Yes → we run `openssl rand -hex` for
    SEARXNG_SECRET (plus CRAWL4AI_API_TOKEN / LANGFUSE_* where enabled) and
    write plaintext values into a local `.env`. `.env` is in `.gitignore` and
    never committed; `just sandbox-init` re-runs the same logic idempotently.
    No → nothing is written; preferably keep only `op://...` 1Password secret
    references in `.env` and launch with `op run --env-file=.env -- just
    sandbox-up`. Otherwise populate `.env` through your vault or secret-injection
    pipeline before startup; the `:?` guards fail loudly when values are absent.
  default: false
  when: "{{ include_sandbox }}"

# ---------------------------------------------------------------------------
# CI/CD
# ---------------------------------------------------------------------------
cicd_provider:
  type: str
  help: >-
    Which CI/CD provider should this project use? GitHub Actions generates
    `.github/workflows/ci.yml` (`just qa`) and `docs.yml` (MkDocs → GitHub
    Pages) plus Dependabot. GitLab CI generates `.gitlab-ci.yml` with the
    canonical quality gate and a strict docs build. None skips all CI files.
  choices:
    "GitHub Actions (ci.yml + docs.yml + Dependabot)": "github_actions"
    "GitLab CI (.gitlab-ci.yml — quality gate + strict docs build)": "gitlab_ci"
    "None — no CI/CD files": "none"
  default: "github_actions"

# ---------------------------------------------------------------------------
# Spec-Driven Development
# ---------------------------------------------------------------------------
sdd_framework:
  type: str
  help: >-
    Wire up a Spec-Driven Development framework? See docs/how-to/spec-driven-development.md
    after generation for guidance.
  choices:
    "None — informal /spec via the workflow skill is enough": "none"
    "Spec-Kit — structured, intent-driven, uv-based": "spec-kit"
  default: "none"
  when: "{{ 'claude_code' in coding_agents or 'codex' in coding_agents or 'pi' in coding_agents or 'opencode' in coding_agents }}"

sdd_install_agent:
  type: str
  help: >-
    Which selected agent should receive the Spec-Kit integration assets?
    Spec-Kit generates agent-specific skills or command files. Defaults to the
    first compatible agent enabled above (claude > codex > pi > opencode).
  choices:
    "Claude Code (.claude/commands/)": "claude"
    "Codex CLI": "codex"
    "Pi Coding Agent": "pi"
    "OpenCode": "opencode"
  default: >-
    {% if 'claude_code' in coding_agents %}claude{% elif 'codex' in coding_agents %}codex{% elif 'pi' in coding_agents %}pi{% elif 'opencode' in coding_agents %}opencode{% else %}claude{% endif %}
  when: "{{ sdd_framework != 'none' }}"

# ---------------------------------------------------------------------------
# Tooling extras
# ---------------------------------------------------------------------------
include_sql:
  type: bool
  help: "Include SQL tooling (sqlfluff pre-commit hook + config)?"
  default: true

sql_dialect:
  type: str
  help: "Default SQL dialect for sqlfluff"
  default: "ansi"
  validator: >-
    {% if not (sql_dialect | regex_search('^[a-z][a-z0-9_-]{0,31}$')) %}
    Use a lowercase SQLFluff dialect identifier (letters, digits, underscore, dash).
    {% endif %}
  when: "{{ include_sql }}"

include_adrs:
  type: bool
  help: >-
    Generate ADR (Architecture Decision Record) support? Adds a `/create-adr`
    skill, an ADR template, an empty `docs/adr/` directory, and ADR guidelines
    in `agent-guidelines/`. Useful for projects with lasting architectural
    decisions; optional for simple libraries or scripts.
  default: false

license:
  type: str
  help: "License (choose 'Proprietary' for a private/closed project)"
  default: "Proprietary"
  choices:
    - "Proprietary"
    - "MIT"
    - "Apache-2.0"

# ---------------------------------------------------------------------------
# Executable third-party tool pins (SPOT — single source of truth)
# ---------------------------------------------------------------------------
# These values are deliberately not prompted or written to the answers file.
# Dependabot cannot update tools installed from generated shell commands, so
# bump this map deliberately and verify all eight render scenarios.
tool_versions:
  type: yaml
  when: false
  default:
    uv: "0.12.3"
    just: "1.58.0"
    claude_code: "2.1.228"
    codex: "0.147.0"
    pi: "0.84.1"
    opencode: "1.18.16"
    aider: "0.16.0"
    context7: "4.0.2"
    ccusage: "20.0.19"
    spec_kit: "0.16.2"
    spec_kit_ref: "4871b485f97c7fa452ec58eba325d87536c55c34"
    pre_commit: "4.6.2"
    pytest: "9.1.1"
    pytest_cov: "7.1.0"
    ruff: "0.16.2"
    mypy: "2.3.0"

# ---------------------------------------------------------------------------
# Shared agent guardrails (SPOT — single source of truth)
# ---------------------------------------------------------------------------
# These lists are the canonical inputs for tool-specific permission
# files (`.claude/settings.json`, `opencode.json`). They are NOT prompted —
# `when: false` keeps them out of the answers file but still injects them
# into the Jinja render context. Edit them here; every tool config updates
# in lockstep. Aider has no native permission system; see AGENTS.md.
shared_allow_bash:
  type: yaml
  when: false
  default:
    - "pwd"
    - "ls*"
    - "rg *"
    - "git status*"
    - "git diff*"
    - "git log*"
    - "git show*"
    - "just --list*"
    - "just qa*"
    - "just lint*"
    - "just typecheck*"
    - "just test*"
    - "just cov*"
    - "just docs-build*"
    - "uv sync*"
    - "uv tree*"
    - "uv run pre-commit*"
    - "uv run pytest*"
    - "uv run mypy*"
    - "uv run ruff*"
    - "uv run pylint*"
    - "uv run bandit*"
    - "uv run interrogate*"
    - "pytest*"
    - "ruff *"
    - "mypy *"

shared_deny_bash:
  type: yaml
  when: false
  default:
    - "rm -rf*"
    - "rm -fr*"
    - "rm -r -f*"
    - "rm -f -r*"
    - "rm --recursive*"
    - "sudo rm*"
    - "sudo *"
    - "chmod 777*"
    - "chmod -R 777*"
    - "curl * | bash*"
    - "curl * | sh*"
    - "wget * | bash*"
    - "wget * | sh*"
    - "* | sudo *"
    - "DROP TABLE*"
    - "TRUNCATE*"

shared_deny_read:
  type: yaml
  when: false
  default:
    - "**/.env"
    - "**/.env.*"
    - "**/.envrc"
    - "**/.netrc"
    - "**/.npmrc"
    - "**/.pypirc"
    - "**/.docker/config.json"
    - "**/.aws/**"
    - "**/.ssh/**"
    - "**/.config/gcloud/**"
    - "**/*secret*"
    - "**/*credentials*"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/*.pem"
    - "**/*.key"

# Paths the agent must never *write* to — guardrails for the files that define
# the guardrails themselves (OWASP ASI06: Memory & Context Poisoning). Without
# this list, a hijacked agent could rewrite its own deny rules, hooks, or CI
# pipeline and persist the change across sessions. `**/.env*` is appended
# in-jinja by `settings.json.jinja` (already covered by `shared_deny_read`).
#
# Claude's trust-sensitive subpaths are granular so runtime memory can remain
# writable. Other agent config trees contain only runtime glue and are denied
# wholesale. Team guidance and skills are protected because they enter future
# model context and are therefore persistence surfaces.
shared_deny_write:
  type: yaml
  when: false
  default: |
    # Claude Code: trust-sensitive subpaths only — LEARNINGS*.md stays writable.
    - ".claude/settings.json"
    - ".claude/settings.local.json"
    - ".claude/agents/**"
    - ".claude/hooks/**"
    - ".claude/commands/**"
    - ".claude/scripts/**"
    - ".claude/plugins/**"
    # Codex / Pi / OpenCode / Aider config.
    - ".codex/**"
    - ".pi/**"
    - ".agents/**"
    - ".opencode/**"
    - ".aider.conf.yml"
    # Top-level agent guidance and project-wide rules.
    - "AGENTS.md"
    - "CLAUDE.md"
    - "agent-guidelines/**"
    - "skills/**"
    - ".specify/memory/constitution.md"
    # Sandbox + pre-commit definitions.
    - "docker/**"
    - "docker-compose.yml"
    - "docker-compose.override.yml"
    - ".pre-commit-config.yaml"
    - ".gitleaks.toml"
    # CI/CD definitions — protect whichever provider was chosen.
    {% if cicd_provider == 'github_actions' -%}
    - ".github/**"
    {% elif cicd_provider == 'gitlab_ci' -%}
    - ".gitlab-ci.yml"
    {% endif -%}
    # Build/task config — editing these is a human review decision.
    - "pyproject.toml"
    - "uv.lock"
    - "justfile"

shared_ask_bash:
  type: yaml
  when: false
  default:
    - "git add*"
    - "git commit*"
    - "git branch*"
    - "git checkout*"
    - "git switch*"
    - "git tag*"
    - "git stash*"
    - "git push*"
    - "git reset*"
    - "git restore*"
    - "git clean*"
    - "git rebase*"
    - "git merge*"
    - "uv add*"
    - "uv remove*"
    - "uv tool*"
    - "uvx *"
    - "just sandbox-*"
    - "docker *"
