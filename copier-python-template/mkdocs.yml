# Docs site for the *template itself* — audience: people choosing, generating
# from, or maintaining this Copier template. This is intentionally separate from
# the MkDocs site that ships *inside* every generated project (see
# template/mkdocs.yml.jinja). Anything under template/ is rendered into a new
# project; everything here stays in the template repo and is never copied out.
site_name: copier-python-template
site_description: A reusable Copier template for standard Python projects (uv + just + pre-commit + MkDocs + AI agents).
site_url: https://robkuehli.github.io/python-project-template/
repo_url: https://github.com/robkuehli/python-project-template
repo_name: robkuehli/python-project-template

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Options reference: options.md
  - Example setups: examples.md
  - Updating projects: updating.md
  - Developing the template: developing.md
  - Decisions: decisions.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
